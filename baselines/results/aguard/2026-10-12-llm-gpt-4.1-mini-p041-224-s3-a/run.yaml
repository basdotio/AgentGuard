# Written BY HAND from the run's raw output, not by baselines/cmd/baseline: the driver (P-021)
# records the flags and the usage but folds verdicts from deterministic findings only, so its own
# verdicts.jsonl is the static column (still recoverable from ledger.jsonl); the files here are
# re-folded from raw/ at the judge's predicate by baselines/cmd/judgefold (P-033). Read
# baselines/README.md "Measuring the judge" before citing any figure produced alongside this file.
# THIS IS NOT A BASELINE: the verdicts depend on a model, a day and the sampling.
#
# WHAT THIS RUN IS FOR: P-041 W6, the 224 subset at samples: 3, FIRST of two runs on the same inputs and
# config. The subset, strata.json and samples.jsonl are byte-identical copies of
# ../2026-09-29-llm-gpt-4.1-mini-s3-votes/, the run this one is compared against in compare.txt. What
# changed is the binary: the judge's severity now comes from a closed per-pass category the model
# names (P-041; judge-prompt below), the model's severity word is recorded in the vote text and
# weighs nothing. Nothing in the excerpt (judge-excerpt=6), the vote bar or the fold changed.
# Three earlier rounds with earlier wordings of the category table (judge-prompt 846bb95cd0ce and
# before) are in the proposal's open question 1 and in raw_archive, not here: the wording moved on
# what they showed, and this is the prompt that ships.
#
# measured by agent-guard's own adapter (agent-guard baselines/adapter/aguard) with --llm passed through, threshold "high" chosen by us, placement: by content, into a fake home; unplaceable trees are handed to `check` directly (the judge does not run on that path)

tool: aguard
tool_version: aguard v0.21.0-14-gdd8001b (commit dd8001b, built 2026-10-12T00:22:48Z) · reputation entries=18 · rules=d74bca61f0da · judge-prompt=ec4382a9226a · judge-excerpt=6
threshold: high
tool_extra_args:
