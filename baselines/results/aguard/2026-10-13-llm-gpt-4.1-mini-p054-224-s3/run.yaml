# Written BY HAND from the run's raw output, not by baselines/cmd/baseline: the driver (P-021)
# records the flags and the usage but folds verdicts from deterministic findings only, so its own
# verdicts.jsonl is the static column (still recoverable from ledger.jsonl); the files here are
# re-folded from raw/ at the judge's predicate by baselines/cmd/judgefold (P-033). Read
# baselines/README.md "Measuring the judge" before citing any figure produced alongside this file.
# THIS IS NOT A BASELINE: the verdicts depend on a model, a day and the sampling.
#
# WHAT THIS RUN IS FOR: P-054, the 224 subset at samples: 3 with the two readings fixed, read against the same-prompt
# control ../2026-10-13-llm-gpt-4.1-mini-p054-224-s3-control/ for "nothing else moved": the change can only remove a
# finding whose quote was the declaration. The 224 subset holds no server, so judge-prompt's move at P-053 (a new
# mode's shapes) did not change a byte of what these samples' requests carry.
#
# measured by agent-guard's own adapter (agent-guard baselines/adapter/aguard) with --llm passed through, threshold "high" chosen by us, placement: by content, into a fake home; unplaceable trees are handed to `check` directly (the judge does not run on that path)

