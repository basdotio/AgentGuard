judge:
    provider: openai                  # preset: endpoint https://api.openai.com/v1
    model: gpt-4.1-mini
    samples: 3                        # majority = 2; each question asked 3 times at temperature 0.8
    authority: advisory
    concurrency: 4
    timeout: 60s                      # default
    total_timeout: 10m                # default
    max_retries: 4
    calls: 1769
    failed: 2
    skipped: 0
    repaired: 5
    prompt_version: 6572379d32b1
    excerpt_version: 6
fold: >-
    verdict = malicious when a deterministic finding is >= high, OR an LLM finding that ESCALATED
    (grounded; k of n at the majority bar) is >= high and its rule is not LLM-009 (advisory-only).
    The finding's severity is the tool's, set from the category the majority of the agreeing votes
    named (P-041); the model's own words are in each vote's `severities`, the categories in its
    `categories`. Per-sample static / judge / judge-any, the escalated rule ids and the votes are in
    judge.jsonl; per-kind-rule.txt is judgefold's table over the same rows. Folded by
    baselines/cmd/judgefold from raw/ (see raw_archive). Nothing here is hand-typed except this file.
