# Written BY HAND from the run's raw output, not by baselines/cmd/baseline: the driver (P-021)
# records the flags and the usage but folds verdicts from deterministic findings only, so its own
# verdicts.jsonl is the static column (still recoverable from ledger.jsonl); the files here are
# re-folded from raw/ at the judge's predicate by baselines/cmd/judgefold (P-033). Read
# baselines/README.md "Measuring the judge" before citing any figure produced alongside this file.
# THIS IS NOT A BASELINE: the verdicts depend on a model, a day and the sampling.
#
# WHAT THIS RUN IS FOR: the same-prompt control for P-054's 224 run: main at e8c691d (P-052 in, P-053 not yet; the
# 224 subset holds no server, so the requests are byte-identical to the P-054 binary's), samples: 3, gpt-4.1-mini.
# Taken on 2026-10-13 as the control of a model probe (gpt-6.1-sol on the same subset: malicious 70 against 71,
# benign 2 against 0, hard negatives 0 against 1 — a tie, recorded in the decisions doc, no proposal).
#
# measured by agent-guard's own adapter (agent-guard baselines/adapter/aguard) with --llm passed through, threshold "high" chosen by us, placement: by content, into a fake home; unplaceable trees are handed to `check` directly (the judge does not run on that path)

tool: aguard
tool_version: aguard v0.23.0-3-ge8c691d (commit e8c691d, built 2026-10-13T03:30:41Z) · reputation entries=18 · rules=d74bca61f0da · judge-prompt=6572379d32b1 · judge-excerpt=6
threshold: high
tool_extra_args:
    - --llm
    - --config
    - <judge config, not committed; reproduced under `judge:` below>
tool_extra_env: []                    # none: the key was read from api_key_file, no proxy was needed
uploads_samples: true
uploads_samples_basis: >-
    this run passed --llm to aguard: redacted excerpts of every judged artifact (skills, CLAUDE.md,
    subagents, commands, hooks, MCP configs; at most 6,000 bytes per skill) were sent to the endpoint
    under `judge:`, three times per question. Samples routed to `check` stayed static; nothing of theirs left the machine.
corpus_commit: 5c3db6ee
