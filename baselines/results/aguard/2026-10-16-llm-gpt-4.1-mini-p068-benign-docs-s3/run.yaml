# Written BY HAND from the run's raw output, not by baselines/cmd/baseline: the driver (P-021)
# records the flags and the usage but folds verdicts from deterministic findings only, so its own
# verdicts.jsonl is the static column (still recoverable from ledger.jsonl); the files here are
# re-folded from raw/ at the judge's predicate by baselines/cmd/judgefold (P-033). Read
# baselines/README.md "Measuring the judge" before citing any figure produced alongside this file.
# THIS IS NOT A BASELINE: the verdicts depend on a model, a day and the sampling.
#
# WHAT THIS RUN IS FOR: P-068 (a reply the reader refuses is asked once more), on the 384 benign trees that name a
# companion document — the list with the highest judge call failure rate seen (1.2% of calls, 48 of 384 trees short a
# question under P-067) — against the P-067 run of the same list: failed calls, trees with a failed call, re-asks, and the
# judge totals, which a repeat of a sampled question may move only within the run band.
#
# measured by agent-guard's own adapter (agent-guard baselines/adapter/aguard) with --llm passed through to scan and, on the server-source route, to check (-aguard-check-llm, P-056), threshold "high" chosen by us, placement: by content, into a fake home; unplaceable trees are handed to `check` directly

