# Written BY HAND from the run's raw output, not by baselines/cmd/baseline. The driver that ran
# this (aguard 7fbbb68, before P-021) wrote a run.yaml that described the static fold and said
# `uploads_samples: false`; both were wrong for this run and that file is not what is kept here.
# Read baselines/README.md "Measuring the judge" before citing any figure produced alongside
# this file. THIS IS NOT A BASELINE: the verdicts below depend on a model, a day and a single
# sample per question. The static baseline these 819 samples belong to is ../2026-09-24/.
#
# measured by agent-guard's own adapter (agent-guard baselines/adapter/aguard) with --llm passed through, threshold "high" chosen by us, placement: by content, into a fake home; unplaceable trees are handed to `check` directly (the judge does not run on that path)

tool: aguard
tool_version: aguard v0.11.0-35-g7fbbb68 (commit 7fbbb68, built 2026-09-24T00:48:53Z) · reputation entries=18
threshold: high
tool_extra_args:
    - --llm
    - --config
    - <judge config, not committed; contents reproduced under `judge:` below>
uploads_samples: true
uploads_samples_basis: >-
    this run passed --llm to aguard: redacted excerpts of every judged artifact (skills, CLAUDE.md,
    subagents, commands, hooks, MCP configs; at most 6,000 bytes per skill) were sent to the endpoint
    under `judge:`. The 127 MCP-server-source samples go through `check`, which is static, so
    nothing of theirs left the machine.
corpus_commit: 5c3db6ee
started_at: 2026-09-24T10:52:19.987397Z
finished_at: 2026-09-25T01:23:38Z   # mtime of the last raw/ file written; about 14.5 h wall clock at -j 2
adapter: agent-guard baselines/adapter/aguard
placement: by content, into a fake home; unplaceable trees are handed to `check` directly
provisional: false
work_list: samples.jsonl              # 819 = 300 malicious + 19 hard-negative + 500 benign, the benign half
                                      # stratified by surface (skills 330, mcp 70, connector 40, hooks 40,
                                      # permission 20) — a random draw, so the list is committed
judge:
    provider: openai_compatible
    endpoint: https://open.bigmodel.cn/api/paas/v4
    model: glm-5.3-flash
    samples: 1                        # ONE answer per question: the consensus bar (spec §5.2.1 ②) was empty
    authority: advisory
    concurrency: 3                    # per process; two driver workers, so about 6 in flight
    timeout: 120s
    total_timeout: 20m
    max_retries: 6
    calls: 1923
    failed: 21                        # 1.1%; each failure is an LLM-000 note on that sample
    skipped: 0
fold: >-
    verdict = malicious when a deterministic finding is >= high, OR an LLM finding that ESCALATED
    (grounded; consensus trivially met at samples=1) is >= high and its rule is not LLM-009. That is
    the behaviour shipped in v0.12.0 (P-019 made LLM-009 advisory-only). severity is the highest
    severity among the findings that count; dimensions and rules come from the findings that carried
    the flag, static and escalated alike. The driver's own fold (deterministic only) gives the static
    column; per-sample static / judge / judge-any and the escalated rule ids are in judge.jsonl.
    Regenerate from raw/ — nothing here is hand-typed except this file.
counts:
    scored: 819
    no_verdict: 0
    error: 0
work_list_size: 819
raw_archive:                          # raw/ left the tree in P-039: 6.2 MB of model output quoting malicious samples,
    asset: aguard-judge-raw-2026-09.tar.gz   # attached as a release asset; holds the raw/ of all four judge runs
    sha256: 10a7ba6eb7e70f336da4616cfb7ff02a0e59749f8868e7ffb1e84ea2faa4eafd
    note: the fold above is reproducible from the archive alone; judge.jsonl here is derived from it
